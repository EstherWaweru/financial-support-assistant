services:

  server:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: ${INSTALL_DEV-true}
    environment:
      - PYTHONBREAKPOINT=ipdb.set_trace
    volumes:
      - root:/root/
      - ./app/:/app/
    entrypoint: uvicorn main:application --reload --host 0.0.0.0 --port 8000
    env_file:
      - ./app/.env
    ports:
      - 8000:8000
      - 8888:8888
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: financial_support
      POSTGRES_USER: app_user
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - ./app/.env
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app_user -d financial_support" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
    postgres-data:
    root: